name: pgl_p2_myportfolio
description: "PGL-P2-MyPortfolio: Sabores de Canarias, app de gastronomía canaria con portfolio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/welcome/
    - assets/images/portfolio/
    - assets/images/categories/
